<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Riwayat - Mamu Coffee</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f3ee;
    color: #3e3028;
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================
   SIDEBAR / NAVBAR DESKTOP
========================= */
.sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 245px;
    height: 100vh;
    background: #3e3028;
    color: white;
    padding: 28px 16px;
    z-index: 100;
    overflow-y: auto;
}

.logo {
    text-align: center;
    margin-bottom: 35px;
}

.logo img {
    width: 105px;
    height: 105px;
    object-fit: contain;
}

.logo h2 {
    font-size: 19px;
    letter-spacing: 1px;
    margin-top: -10px;
}

.nav {
    display: flex;
    flex-direction: column;
}

.nav a {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #f7eee7;
    text-decoration: none;
    padding: 14px 13px;
    margin-bottom: 9px;
    border-radius: 12px;
    font-size: 14px;
    transition: 0.2s;
}

.nav a:hover,
.nav a.active {
    color: white;
    background: #c58b5b;
}

.nav-icon {
    font-size: 19px;
    min-width: 23px;
    text-align: center;
}

.pending-badge {
    margin-left: auto;
    min-width: 23px;
    padding: 4px 6px;
    border-radius: 20px;
    background: #f3d7bd;
    color: #3e3028;
    text-align: center;
    font-size: 11px;
    font-weight: bold;
}

.nav a.cart-link {
    display: none;
}

/* =========================
   MAIN
========================= */
.main {
    margin-left: 245px;
    padding: 30px;
    min-width: 0;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 30px;
}

.header p {
    color: #89776b;
    margin-top: 7px;
}

/* =========================
   FILTER TANGGAL
========================= */
.filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

.filter input {
    min-width: 150px;
    padding: 11px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    background: white;
    color: #3e3028;
}

.filter input:focus {
    border-color: #c58b5b;
}

.filter button {
    border: none;
    background: #c58b5b;
    color: white;
    padding: 11px 13px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
}

.filter button:hover {
    background: #a97043;
}

.filter .clear-all {
    background: #b94b45;
}

.filter .clear-all:hover {
    background: #963a35;
}

.filter .export-btn {
    background: #47795b;
}

.filter .export-btn:hover {
    background: #38604a;
}
.date-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: #89776b;
    font-size: 12px;
}

.quick-range {
    display: flex;
    gap: 8px;
}
/* =========================
   DAFTAR RIWAYAT
========================= */
.history-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
}

.history-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    min-width: 0;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 15px;
    padding-bottom: 12px;
    border-bottom: 1px solid #eee;
}

.transaction-id {
    font-weight: bold;
    font-size: 17px;
    overflow-wrap: anywhere;
}

.date {
    color: #89776b;
    font-size: 13px;
    margin-top: 7px;
    line-height: 1.5;
}

.status {
    display: inline-block;
    background: #e7f5e8;
    color: #2d7a35;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 8px;
}

/* =========================
   NAMA PEMBELI
========================= */
.buyer-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.buyer-info strong {
    flex-shrink: 0;
}

.buyer-info span {
    color: #89776b;
    text-align: right;
    overflow-wrap: anywhere;
}

/* =========================
   ITEM PESANAN
========================= */
.items {
    margin-top: 15px;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #f0f0f0;
}

.item:last-child {
    border-bottom: none;
}

.item-name {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
}

.item-name span {
    overflow-wrap: anywhere;
    line-height: 1.4;
}

.item-name small {
    color: #89776b;
    font-size: 12px;
}

.item > strong {
    text-align: right;
    white-space: nowrap;
    font-size: 14px;
}

/* =========================
   TOTAL
========================= */
.total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 2px solid #eee;
    font-size: 18px;
    font-weight: bold;
}

.total span:last-child {
    color: #c58b5b;
    text-align: right;
}

/* =========================
   PEMBAYARAN
========================= */
.payment-info {
    border-top: 1px solid #eee;
    margin-top: 15px;
    padding-top: 12px;
}

.payment-info div {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 9px;
}

.payment-info span:first-child {
    color: #89776b;
}

.payment-info span:last-child {
    font-weight: 600;
    text-align: right;
    overflow-wrap: anywhere;
}

/* =========================
   TOMBOL AKSI
========================= */
.actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 17px;
    padding-top: 13px;
    border-top: 1px solid #eee;
}

.delete-btn, .print-btn, .rawbt-btn {
    border: none;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    color: white;
}

.delete-btn { background: #b94b45; }
.delete-btn:hover { background: #963a35; }

.print-btn { background: #3e3028; }
.print-btn:hover { background: #594438; }

.rawbt-btn { background: #47795b; }
.rawbt-btn:hover { background: #38604a; }

/* =========================
    RIWAYAT KOSONG
========================= */
.empty {
    background: white;
    padding: 55px 20px;
    text-align: center;
    border-radius: 15px;
    color: #89776b;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.empty h3 {
    color: #3e3028;
    margin-bottom: 8px;
}

.empty p {
    font-size: 14px;
    line-height: 1.6;
}

/* =========================
   RESPONSIF TABLET & HP (NAVBAR DI ATAS)
========================= */
@media (max-width: 1000px) {
    .main { padding: 25px 20px; }
    .header { align-items: flex-start; flex-direction: column; gap: 16px; }
    .filter { width: 100%; }
}

@media (max-width: 800px) {
    .sidebar {
        inset: 0 0 auto 0;
        width: 100%;
        height: calc(68px + env(safe-area-inset-top, 0px));
        padding: 6px 8px;
        padding-top: env(safe-area-inset-top, 0px);
        display: flex;
        flex-direction: row;
        align-items: stretch;
        overflow: visible;
        background: #3e3028;
        z-index: 200;
        box-shadow: 0 4px 18px rgba(62, 48, 40, 0.18);
    }

    .logo { display: none; }
    .nav { width: 100%; flex-direction: row; gap: 4px; }

    .nav a, .nav a.cart-link {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        margin: 0;
        padding: 6px 2px;
        border-radius: 12px;
        font-size: 10px;
        line-height: 1.2;
        text-align: center;
    }

    .nav a.cart-link { background: #594438; }
    .nav-icon { font-size: 21px; min-width: 0; }

    .pending-badge {
        position: absolute;
        top: 2px;
        left: 50%;
        margin-left: 8px;
        min-width: 18px;
        padding: 2px 5px;
        font-size: 10px;
    }

    .main {
        margin-left: 0;
        padding: 20px 15px 25px;
        width: 100%;
        /* Jarak atas agar konten tidak tertutup navbar di atas */
        padding-top: calc(68px + 28px + env(safe-area-inset-top, 0px));
    }

        .ble-btn {
        padding: 10px 15px;
        font-size: 13px;
    }

    .quick-range {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
    }

    .filter { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filter input { grid-column: 1 / -1; width: 100%; }
    .filter button { width: 100%; padding: 11px 8px; font-size: 13px; }
    .filter .export-btn { grid-column: 1 / -1; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

<!-- SIDEBAR / NAVBAR ATAS (UNTUK HP) -->
<aside class="sidebar">
    <div class="logo">
        <img src="logo-removebg-preview.png" alt="Logo Mamu Coffee">
        <h2>MAMMU COFFEE</h2>
    </div>

    <nav class="nav">
        <a href="index.html">
            <span class="nav-icon">☕</span>
            <span>Menu</span>
        </a>

        <a href="pembayaran-tertunda.html">
            <span class="nav-icon">⏳</span>
            <span>Pembayaran Tertunda</span>
            <span class="pending-badge" id="pendingCount">0</span>
        </a>

        <a href="riwayat.html" class="active">
            <span class="nav-icon">📋</span>
            <span>Riwayat</span>
        </a>

        <a href="stok.html">
            <span class="nav-icon">📦</span>
            <span>Stok Bahan</span>
        </a>

        <a href="index.html#pesanan" class="cart-link">
            <span class="nav-icon">🛒</span>
            <span>Pesanan</span>
            <span class="pending-badge" id="cartCount">0</span>
        </a>
    </nav>
</aside>

<!-- KONTEN UTAMA -->
<main class="main">
    <div class="header">
        <div>
            <h1>Riwayat Transaksi</h1>
            <p>Lihat dan kelola transaksi Mamu Coffee.</p>
        </div>

        <div class="filter">
            <label class="date-field">
                <span>Dari</span>
                <input type="date" id="dateFrom" aria-label="Dari tanggal">
            </label>

            <label class="date-field">
                <span>Sampai</span>
                <input type="date" id="dateTo" aria-label="Sampai tanggal">
            </label>
            <button onclick="filterHistory()">Filter</button>
            <button onclick="resetFilter()">Reset</button>
            <button class="clear-all" onclick="clearAllHistory()">Hapus Semua</button>
            <button class="export-btn" onclick="exportToExcel()">📥 Export Excel</button>
        </div>
    </div>

    <div id="historyContainer" class="history-container"></div>
</main>

<script>
const HISTORY_KEY = "mammo_history";

function formatRupiah(number) {
    return "Rp " + Number(number || 0).toLocaleString("id-ID");
}

function formatDate(dateString) {
    if (!dateString) return "-";
    const date = new Date(dateString);
    if (Number.isNaN(date.getTime())) return dateString;
    return date.toLocaleString("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    }) + " WIB";
}

function getIcon(name) {
    const lower = String(name || "").toLowerCase();

    if (
        lower.includes("ice cream") ||
        lower.includes("icecream") ||
        lower.includes("es krim") ||
        lower.includes("eskrim") ||
        lower.includes("sundae")
    ) return "🍦";

    if (lower.includes("americano") || lower.includes("espresso") || lower.includes("sanger")) return "☕";
    if (lower.includes("latte")) return "🥛";
    if (lower.includes("chocolate")) return "🍫";
    if (lower.includes("taro") || lower.includes("milk")) return "🥤";
    if (lower.includes("magic") || lower.includes("soda")) return "🧊";
    if (lower.includes("cream") || lower.includes("sundae") || lower.includes("ice")) return "🍦"; // Tambahan baru
    if (lower.includes("indomie") || lower.includes("pop mie")) return "🍜";
    if (lower.includes("kentang") || lower.includes("nugget") || lower.includes("sosis") || lower.includes("plantter")) return "🍟";
    if (lower.includes("extra shot")) return "➕";
    return "🥤";
}

function getHistory() {
    try {
        const history = JSON.parse(localStorage.getItem(HISTORY_KEY));
        return Array.isArray(history) ? history : [];
    } catch (error) {
        return [];
    }
}

function loadHistory() {
    renderHistory(filterByDate(getHistory()));
}

function setQuickRange(days) {
    const end = new Date();
    const start = new Date();

    start.setDate(end.getDate() - (days - 1));

    document.getElementById("dateFrom").value = localDateKey(start);
    document.getElementById("dateTo").value = localDateKey(end);

    loadHistory();
}

function renderHistory(history) {
    const container = document.getElementById("historyContainer");

    if (history.length === 0) {
        const selectedDate = hasDateFilter();
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🧾</div>
                <h3>${selectedDate ? "Tidak ada transaksi pada tanggal ini" : "Belum ada riwayat transaksi"}</h3>
                <p>${selectedDate ? "Coba pilih tanggal yang lain atau tekan Reset." : "Transaksi yang sudah dibayar akan muncul di sini."}</p>
            </div>
        `;
        return;
    }

    container.innerHTML = [...history].reverse().map((transaction, index) => {
        const transactionId = transaction.id || "TRX-" + (index + 1);
        const items = Array.isArray(transaction.items) ? transaction.items : [];
        const paymentMethod = transaction.paymentMethod || "Cash";

        return `
            <div class="history-card">
                <div class="history-header">
                    <div>
                        <div class="transaction-id">${escapeHTML(transactionId)}</div>
                        <div class="date">${escapeHTML(formatDate(transaction.date))}</div>
                        <span class="status">${escapeHTML(transaction.status || "Lunas")}</span>
                    </div>
                </div>

                <div class="buyer-info">
                    <strong>Nama Pembeli</strong>
                    <span>${escapeHTML(transaction.buyerName || "-")}</span>
                </div>

                <div class="items">
                    ${items.map(item => `
                        <div class="item">
                            <div class="item-name">
                                <span>${getIcon(item.name)} ${escapeHTML(item.name || "Menu")}</span>
                                <small>${Number(item.qty || 0)} x ${formatRupiah(item.price)}</small>
                            </div>
                            <strong>${formatRupiah(Number(item.price || 0) * Number(item.qty || 0))}</strong>
                        </div>
                    `).join("")}
                </div>

                <div class="total">
                    <span>Total</span>
                    <span>${formatRupiah(transaction.total)}</span>
                </div>

                <div class="payment-info">
                    <div>
                        <span>Metode Pembayaran</span>
                        <span><strong>${escapeHTML(paymentMethod)}</strong></span>
                    </div>
                    <div>
                        <span>Pembayaran</span>
                        <span>${formatRupiah(transaction.payment)}</span>
                    </div>
                    <div>
                        <span>Kembalian</span>
                        <span>${formatRupiah(transaction.change)}</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="print-btn" onclick="printReceipt('${escapeHTML(String(transactionId))}')">
                        🖨 Cetak Struk
                    </button>
                    <button class="delete-btn" onclick="deleteHistoryById('${escapeHTML(String(transactionId))}')">
                        🗑 Hapus
                    </button>
                </div>
            </div>
        `;
    }).join("");
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => {
        const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        return entities[character];
    });
}

function filterHistory() { loadHistory(); }
function resetFilter() { document.getElementById("dateFilter").value = ""; loadHistory(); }

function deleteHistoryById(id) {
    if (!confirm("Yakin ingin menghapus transaksi ini?")) return;
    const history = getHistory();
    const updatedHistory = history.filter(transaction => String(transaction.id) !== String(id));
    localStorage.setItem(HISTORY_KEY, JSON.stringify(updatedHistory));
    loadHistory();
}

function clearAllHistory() {
    const history = getHistory();
    if (history.length === 0) { alert("Belum ada riwayat transaksi."); return; }
    if (!confirm("Yakin ingin menghapus semua riwayat transaksi?")) return;
    localStorage.removeItem(HISTORY_KEY);
    loadHistory();
}

/* =========================
   FILTER RENTANG TANGGAL
========================= */
function localDateKey(dateString) {
    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) return String(dateString || "");

    return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
    ].join("-");
}

function getDateRange() {
    let from = document.getElementById("dateFrom").value;
    let to = document.getElementById("dateTo").value;

    /* Kalau terbalik, tukar otomatis */
    if (from && to && from > to) {
        [from, to] = [to, from];
    }

    return { from, to };
}

function hasDateFilter() {
    const range = getDateRange();
    return Boolean(range.from || range.to);
}

function filterByDate(history) {
    const range = getDateRange();

    if (!range.from && !range.to) return history;

    return history.filter(transaction => {
        if (!transaction.date) return false;

        const key = localDateKey(transaction.date);

        if (range.from && key < range.from) return false;
        if (range.to && key > range.to) return false;

        return true;
    });
}

function getFilteredHistory() {
    return filterByDate(getHistory());
}

function getRangeLabel() {
    const range = getDateRange();

    if (range.from && range.to) {
        return range.from === range.to ? range.from : range.from + "_sd_" + range.to;
    }

    if (range.from) return "dari-" + range.from;
    if (range.to) return "sampai-" + range.to;

    return "";
}

function exportToExcel() {
    if (typeof XLSX === "undefined") {
        alert("Library Excel belum termuat. Pastikan internet aktif lalu muat ulang halaman.");
        return;
    }

    const history = getFilteredHistory();

    if (history.length === 0) {
        alert("Tidak ada transaksi untuk diexport.");
        return;
    }

    function dayLabel(dateString) {
        const date = new Date(dateString);

        if (Number.isNaN(date.getTime())) return String(dateString || "-");

        return date.toLocaleDateString("id-ID", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
    }

    /* Gabungkan menu yang sama dalam satu hari */
    const grouped = new Map();
    let grandTotal = 0;
    let totalCup = 0;

    history.forEach(transaction => {
        const items = Array.isArray(transaction.items) ? transaction.items : [];
        const day = localDateKey(transaction.date);

        /* Transaksi lama tanpa data metode dianggap Cash */
        const method = String(transaction.paymentMethod || "Cash");

        grandTotal += Number(transaction.total) || 0;

        items.forEach(item => {
            const name = String(item.name || "Menu").trim();
            const qty = Number(item.qty) || 0;
            const price = Number(item.price) || 0;
            const key = day + "|" + name.toLowerCase();

            if (!grouped.has(key)) {
                grouped.set(key, {
                    date: transaction.date,
                    name: name,
                    qty: 0,
                    subtotal: 0,
                    ids: [],
                    buyers: [],
                    statuses: [],
                    methods: {}
                });
            }

            const row = grouped.get(key);

            row.qty += qty;
            row.subtotal += qty * price;
            totalCup += qty;
            row.methods[method] = (row.methods[method] || 0) + qty;

            const id = transaction.id || "-";
            const buyer = transaction.buyerName || "-";
            const status = transaction.status || "Lunas";

            if (!row.ids.includes(id)) row.ids.push(id);
            if (!row.buyers.includes(buyer)) row.buyers.push(buyer);
            if (!row.statuses.includes(status)) row.statuses.push(status);
        });
    });

    function methodText(methods) {
        const names = Object.keys(methods);

        if (names.length === 1) return names[0];

        return names.map(name => name + " (" + methods[name] + ")").join(", ");
    }

    const rows = [];

    /* Urut berdasarkan tanggal lalu nama menu */
    const sortedGroups = [...grouped.values()].sort((a, b) => {
        const dayA = localDateKey(a.date);
        const dayB = localDateKey(b.date);

        if (dayA !== dayB) return dayA < dayB ? -1 : 1;

        return a.name.localeCompare(b.name, "id", { sensitivity: "base", numeric: true });
    });

    sortedGroups.forEach(row => {
        rows.push({
            "No. Transaksi": row.ids.join(", "),
            "Tanggal": dayLabel(row.date),
            "Nama Pembeli": row.buyers.join(", "),
            "Status": row.statuses.join(", "),
            "Menu": row.name,
            "Qty": row.qty,
            "Harga": row.qty ? Math.round(row.subtotal / row.qty) : 0,
            "Subtotal": row.subtotal,
            "Total Transaksi": "",
            "Metode Pembayaran": methodText(row.methods),
            "Rekap Menu (per hari)": row.name + " x" + row.qty
        });
    });

    rows.push({
        "No. Transaksi": "TOTAL CUP",
        "Qty": totalCup
    });

    rows.push({
        "No. Transaksi": "TOTAL PENDAPATAN",
        "Total Transaksi": grandTotal
    });

    const sheet = XLSX.utils.json_to_sheet(rows);

    sheet["!cols"] = [
        { wch: 22 }, { wch: 20 }, { wch: 22 }, { wch: 10 },
        { wch: 26 }, { wch: 6 },  { wch: 12 }, { wch: 12 },
        { wch: 16 }, { wch: 22 }, { wch: 12 }, { wch: 40 }
    ];

    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, sheet, "Riwayat");

    const today = localDateKey(new Date());

    XLSX.writeFile(
        workbook,
        "Riwayat-Mamu-Coffee-" + (getRangeLabel() || today) + ".xlsx"
    );
}

/* CETAK STRUK (BROWSER) */
function printReceipt(id) {
    const transaction = getHistory().find(item => String(item.id) === String(id));
    if (!transaction) { alert("Transaksi tidak ditemukan."); return; }

    const items = Array.isArray(transaction.items) ? transaction.items : [];
    const paymentMethod = transaction.paymentMethod || "Cash";

    const itemsHTML = items.map(item => {
        const qty = Number(item.qty) || 0;
        const price = Number(item.price) || 0;
        return `
            <div class="item">
                <div>${escapeHTML(item.name || "Menu")}</div>
                <div class="row">
                    <span>${qty} x ${formatRupiah(price)}</span>
                    <span>${formatRupiah(qty * price)}</span>
                </div>
            </div>
        `;
    }).join("");

    const receiptCSS =
        "@page{size:58mm auto;margin:0}" +
        "*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace}" +
        "body{width:58mm;padding:4mm 3mm;color:#000;font-size:11px;line-height:1.4}" +
        ".center{text-align:center}" +
        ".brand{font-size:15px;font-weight:bold;letter-spacing:1px}" +
        ".line{border-top:1px dashed #000;margin:6px 0}" +
        ".row{display:flex;justify-content:space-between;gap:6px}" +
        ".item{margin-bottom:5px}" +
        ".bold{font-weight:bold}" +
        ".big{font-size:13px}" +
        ".name{overflow-wrap:anywhere}";

    const receiptBody = `
        <div class="center">
            <div class="brand">MAMU COFFEE</div>
            <div>Struk Pembayaran</div>
        </div>
        <div class="line"></div>
        <div>No : ${escapeHTML(transaction.id || "-")}</div>
        <div>Tgl: ${escapeHTML(formatDate(transaction.date))}</div>
        <div class="name">Pembeli: ${escapeHTML(transaction.buyerName || "-")}</div>
        <div class="line"></div>
        ${itemsHTML}
        <div class="line"></div>
        <div class="row bold big">
            <span>TOTAL</span>
            <span>${formatRupiah(transaction.total)}</span>
        </div>
        <div class="row">
            <span>Metode</span>
            <span>${escapeHTML(paymentMethod)}</span>
        </div>
        <div class="row">
            <span>Bayar</span>
            <span>${formatRupiah(transaction.payment)}</span>
        </div>
        <div class="row">
            <span>Kembali</span>
            <span>${formatRupiah(transaction.change)}</span>
        </div>
        <div class="line"></div>
        <div class="center">
            <div>Status: ${escapeHTML(transaction.status || "Lunas")}</div>
            <div>Terima kasih</div>
        </div>
    `;

    const printWindow = window.open("", "_blank", "width=380,height=600");
    if (!printWindow) { alert("Popup diblokir."); return; }

    const doc = printWindow.document;
    doc.open();
    doc.write("<title>Struk</title>");
    doc.close();

    const style = doc.createElement("style");
    style.textContent = receiptCSS;
    doc.head.appendChild(style);
    doc.body.innerHTML = receiptBody;

    setTimeout(() => {
        printWindow.focus();
        printWindow.print();
    }, 400);
}

loadHistory();

function updateNavBadges() {
    try {
        const pending = JSON.parse(localStorage.getItem("mammo_pending")) || [];
        const cart = JSON.parse(localStorage.getItem("mammo_cart")) || {};
        const cartTotal = Object.values(cart).reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
        document.getElementById("pendingCount").textContent = pending.length;
        document.getElementById("cartCount").textContent = cartTotal;
    } catch (error) {}
}

updateNavBadges();
